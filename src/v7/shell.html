/* =====================================================================================================
   FHE Lift Planner v8 — "Cab glass" (v8: outrigger leg loads)
   Apple-style system UI: inset-grouped lists, frosted bars, bottom sheets, one hi-vis yellow accent.
   Signature: the capacity ring — a crane LMI reading turned into one big glanceable circle.
   Every colour comes from the tokens below; components never use raw hex.
   ===================================================================================================== */
:root {
  --bg: #f2f2f7; --bg-2: #e9e9ef; --card: #ffffff; --card-2: #f7f7fa; --fill: rgba(118, 118, 128, .12); --fill-2: rgba(118, 118, 128, .2);
  --ink: #0b0b0f; --ink-2: #5b5b63; --ink-3: #8a8a92; --hair: rgba(60, 60, 67, .16); --hair-2: rgba(60, 60, 67, .28);
  --glass: rgba(249, 249, 251, .78); --glass-line: rgba(0, 0, 0, .08); --scrim: rgba(0, 0, 0, .28);
  --brand: #ffc20e; --brand-ink: #1a1400; --brand-soft: rgba(255, 194, 14, .16);
  --safe: #1fa855; --safe-fill: #34c759; --safe-soft: rgba(52, 199, 89, .14);
  --warn: #b85c00; --warn-fill: #ff9f0a; --warn-soft: rgba(255, 159, 10, .16);
  --stop: #d70015; --stop-fill: #ff3b30; --stop-soft: rgba(255, 59, 48, .13);
  --info: #0a6cd6; --info-fill: #0a84ff; --info-soft: rgba(10, 132, 255, .12);
  --canvas: #ffffff;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .06), 0 1px 1px rgba(0, 0, 0, .04);
  --shadow-2: 0 10px 30px rgba(0, 0, 0, .10), 0 2px 6px rgba(0, 0, 0, .06);
  --shadow-3: 0 24px 60px rgba(0, 0, 0, .22), 0 4px 14px rgba(0, 0, 0, .10);
  --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-disp: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-num: ui-rounded, "SF Pro Rounded", -apple-system, "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --ease: cubic-bezier(.32, .72, 0, 1); --ease-out: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.36, .64, 1);
  --r-s: 10px; --r: 14px; --r-l: 22px; --top-h: 56px; --panel-w: 400px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --bg-2: #0c0c0e; --card: #1c1c1e; --card-2: #232326; --fill: rgba(120, 120, 128, .24); --fill-2: rgba(120, 120, 128, .36);
  --ink: #f5f5f7; --ink-2: #a1a1a8; --ink-3: #6e6e75; --hair: rgba(84, 84, 88, .55); --hair-2: rgba(120, 120, 128, .6);
  --glass: rgba(22, 22, 24, .74); --glass-line: rgba(255, 255, 255, .08); --scrim: rgba(0, 0, 0, .5);
  --brand-soft: rgba(255, 194, 14, .18);
  --safe: #30d158; --safe-fill: #30d158; --safe-soft: rgba(48, 209, 88, .18);
  --warn: #ffb340; --warn-fill: #ff9f0a; --warn-soft: rgba(255, 159, 10, .2);
  --stop: #ff6961; --stop-fill: #ff453a; --stop-soft: rgba(255, 69, 58, .2);
  --info: #64b5ff; --info-fill: #0a84ff; --info-soft: rgba(10, 132, 255, .2);
  --canvas: #0d0f12;
  --shadow-2: 0 10px 30px rgba(0, 0, 0, .5); --shadow-3: 0 24px 60px rgba(0, 0, 0, .6);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #000000; --bg-2: #0c0c0e; --card: #1c1c1e; --card-2: #232326; --fill: rgba(120, 120, 128, .24); --fill-2: rgba(120, 120, 128, .36);
  --ink: #f5f5f7; --ink-2: #a1a1a8; --ink-3: #6e6e75; --hair: rgba(84, 84, 88, .55); --hair-2: rgba(120, 120, 128, .6);
  --glass: rgba(22, 22, 24, .74); --glass-line: rgba(255, 255, 255, .08); --scrim: rgba(0, 0, 0, .5);
  --brand-soft: rgba(255, 194, 14, .18);
  --safe: #30d158; --safe-fill: #30d158; --safe-soft: rgba(48, 209, 88, .18);
  --warn: #ffb340; --warn-fill: #ff9f0a; --warn-soft: rgba(255, 159, 10, .2);
  --stop: #ff6961; --stop-fill: #ff453a; --stop-soft: rgba(255, 69, 58, .2);
  --info: #64b5ff; --info-fill: #0a84ff; --info-soft: rgba(10, 132, 255, .2);
  --canvas: #0d0f12;
  --shadow-2: 0 10px 30px rgba(0, 0, 0, .5); --shadow-3: 0 24px 60px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; text-rendering: optimizeLegibility; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
input, select, textarea { -webkit-appearance: none; appearance: none; }
:focus { outline: none; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--info-fill) 70%, transparent); outline-offset: 2px; border-radius: 10px; }
svg { flex: none; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.sp { flex: 1; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

/* ---------- press feedback (every tappable thing gives way under the finger) ---------- */
.tap { transition: transform .35s var(--spring), background-color .2s, opacity .2s, box-shadow .2s; }
.tap:active { transform: scale(.96); transition-duration: .08s; }

/* ---------- app frame ---------- */
#app { position: fixed; inset: 0; display: grid; grid-template-rows: calc(var(--top-h) + var(--sat)) minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }
body.locked #app { visibility: hidden; }
.top { grid-row: 1; position: relative; z-index: 30; display: flex; align-items: center; gap: 10px; padding: var(--sat) calc(12px + var(--sar)) 0 calc(12px + var(--sal)); background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px); border-bottom: .5px solid var(--glass-line); }
.stage { grid-row: 2; position: relative; overflow: hidden; background: var(--canvas); }
.panel { grid-row: 3; position: relative; z-index: 20; background: var(--bg); padding: 10px calc(12px + var(--sar)) calc(10px + var(--sab)) calc(12px + var(--sal)); display: grid; gap: 10px; border-top: .5px solid var(--glass-line); }
@media (min-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr) var(--panel-w); grid-template-rows: calc(var(--top-h) + var(--sat)) minmax(0, 1fr); }
  .top { grid-column: 1 / -1; }
  .stage { grid-row: 2; grid-column: 1; }
  .panel { grid-row: 2; grid-column: 2; border-top: 0; border-left: .5px solid var(--glass-line); padding: 16px 16px calc(16px + var(--sab)); align-content: start; overflow-y: auto; gap: 14px; }
}

/* ---------- top bar ---------- */
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 6px 8px 6px 4px; border-radius: 12px; }
.brand .mk { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12); }
.brand .nm { display: grid; min-width: 0; text-align: left; line-height: 1.15; }
.brand .nm b { font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26vw; }
.brand .nm small { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26vw; }
.brand:hover { background: var(--fill); }
.lifts { display: flex; align-items: center; gap: 4px; padding: 3px; background: var(--fill); border-radius: 12px; margin: 0 auto; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.lifts::-webkit-scrollbar { display: none; }
.lift-t { position: relative; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.lift-t[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow-1), 0 0 0 .5px var(--glass-line); }
.lift-t .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.lift-t .dot.ok { background: var(--safe-fill); } .lift-t .dot.warn { background: var(--warn-fill); } .lift-t .dot.fail { background: var(--stop-fill); }
.lift-t.add { width: 36px; padding: 0; justify-content: center; color: var(--ink-2); }
.lift-t .lt-w { display: none; }
@media (min-width: 900px) { .lift-t .lt-w { display: inline; } }
.tb-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); }
.tb-btn:hover { background: var(--fill); }
.tb-btn:disabled { opacity: .3; pointer-events: none; }
.tb-save { position: relative; }
.tb-save i { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn-fill); box-shadow: 0 0 0 2px var(--glass); transform: scale(0); transition: transform .35s var(--spring); }
.tb-save.dirty i { transform: scale(1); }

@media (max-width: 899px) { .vs { min-width: 46px; } .float.tl { top: 10px; } .float.tr { top: 10px; } .float.tr .pill-bar { flex-direction: column; } .float.tr .fbtn { width: 44px !important; padding: 0 !important; font-size: 11px !important; } }

/* ---------- status: the capacity ring (signature) ---------- */
.status { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 12px 14px; border-radius: var(--r-l); background: var(--card); box-shadow: var(--shadow-1); text-align: left; width: 100%; }

.verdict { display: grid; gap: 2px; min-width: 0; }
.verdict .vw { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; font-family: var(--f-disp); font-size: clamp(19px, 5.6vw, 24px); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }

.wt { display: grid; align-content: center; justify-items: start; gap: 2px; padding: 10px 14px; border-radius: var(--r-l); background: var(--brand); color: var(--brand-ink); min-width: 104px; box-shadow: var(--shadow-1); }

@media (min-width: 900px) {

}

/* ---------- tiles: the four numbers that set the lift ---------- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { position: relative; display: grid; justify-items: start; align-content: space-between; gap: 6px; min-height: 76px; padding: 10px 10px 9px; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow-1); text-align: left; overflow: hidden; }

/* ---------- action dock ---------- */
.dock { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.dk { display: grid; justify-items: center; gap: 5px; padding: 4px 0 2px; border-radius: 14px; font-size: 12px; font-weight: 600; color: var(--ink-2); }

}

@media (min-width: 900px) { .checks-mini { display: grid; gap: 2px; background: var(--card); border-radius: var(--r-l); padding: 6px; box-shadow: var(--shadow-1); } }

/* ---------- inset-grouped lists (iOS Settings style) ---------- */
.grp { display: grid; gap: 6px; }

.grp > h3 { margin: 0 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }

.it.stack { flex-direction: column; align-items: stretch; gap: 6px; padding-top: 12px; padding-bottom: 12px; }
.it.stack > .lb b { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.it.off { opacity: .45; }

/* ---------- controls ---------- */
.sw { position: relative; flex: none; width: 51px; height: 31px; }

.sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .35s var(--spring); }

.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 3px; gap: 2px; background: var(--fill); border-radius: 11px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 20px; border-radius: 14px; font-size: 17px; font-weight: 650; background: var(--fill); color: var(--ink); white-space: nowrap; }

/* ---------- sheets (bottom on phones, side card on desktop) ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); opacity: 0; transition: opacity .45s var(--ease); }
.scrim.on { opacity: 1; }

.sh-h { flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px 10px 20px; touch-action: none; }

.sh-b { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 4px 16px calc(24px + var(--sab)); -webkit-overflow-scrolling: touch; }
.sh-b.fade-in > * { animation: fadeUp .45s var(--ease) both; }

@keyframes rise { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
@media (min-width: 900px) {
  .scrim.desk-clear { background: transparent; pointer-events: none; }
  .sheet { left: auto; top: calc(var(--top-h) + var(--sat) + 10px); right: 10px; bottom: 10px; width: calc(var(--panel-w) - 20px); max-height: none; border-radius: var(--r-l); transform: translateX(calc(100% + 24px)); box-shadow: var(--shadow-3), 0 0 0 .5px var(--glass-line); }

  .sheet.modal { left: 50%; right: auto; top: 50%; bottom: auto; width: min(560px, calc(100% - 40px)); max-height: min(760px, calc(100% - 80px)); transform: translate(-50%, -46%) scale(.96); opacity: 0; transition: transform .45s var(--ease), opacity .3s; }

}

/* ---------- number editor (the "dial") ---------- */
.dial { display: grid; gap: 18px; padding: 6px 0 4px; }

.pm { width: clamp(52px, 15vw, 64px); height: clamp(52px, 15vw, 64px); border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow-1); color: var(--ink); flex: none; }

.dial-range { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); margin-top: -8px; padding: 0 4px; font-variant-numeric: tabular-nums; }
.slider { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; cursor: pointer; margin: 0; touch-action: pan-y; --p: 50%; }
.slider::-webkit-slider-runnable-track { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--ink) 0 var(--p), var(--fill-2) var(--p) 100%); }
.slider::-moz-range-track { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--ink) 0 var(--p), var(--fill-2) var(--p) 100%); }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; margin-top: -11px; border-radius: 50%; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.2), 0 0 0 .5px rgba(0,0,0,.08); transition: transform .3s var(--spring); }
.slider::-moz-range-thumb { width: 34px; height: 34px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.2); }
.slider:active::-webkit-slider-thumb { transform: scale(1.12); }
.slider:disabled { opacity: .35; }
.dial-out { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mini { display: grid; gap: 2px; padding: 10px 12px; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow-1); }
.mini span { font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }

.mini.ok b { color: var(--safe); } .mini.warn b { color: var(--warn); } .mini.fail b { color: var(--stop); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); background: var(--info-soft); color: var(--ink); font-size: 14px; line-height: 1.4; }
.note svg { margin-top: 1px; color: var(--info); }
.note.warn { background: var(--warn-soft); } .note.warn svg { color: var(--warn); }
.note.fail { background: var(--stop-soft); } .note.fail svg { color: var(--stop); }
.note.ok { background: var(--safe-soft); } .note.ok svg { color: var(--safe); }

/* ---------- lift side picker ---------- */
.side-pick { display: grid; justify-items: center; gap: 10px; padding: 4px 0; }
.side-pick svg { width: min(340px, 100%); height: auto; }
.side-pick .zone { cursor: pointer; }
.side-pick .zone path { fill: var(--fill); stroke: var(--hair-2); stroke-width: 1; transition: fill .25s; }
.side-pick .zone:hover path { fill: var(--fill-2); }
.side-pick .zone.on path { fill: var(--brand); stroke: transparent; }
.side-pick .zone text { font: 700 15px var(--f-ui); fill: var(--ink-2); pointer-events: none; }
.side-pick .zone.on text { fill: var(--brand-ink); }
.side-pick .zone.no { cursor: not-allowed; }
.side-pick .zone.no path { fill: var(--stop-soft); stroke: transparent; }
.side-pick .zone.no text { fill: var(--stop); }
.side-pick .body { fill: var(--card); stroke: var(--ink); stroke-width: 2; }
.side-pick .cab { fill: var(--ink); }
.side-pick .boom { stroke: var(--brand-ink); stroke-width: 7; stroke-linecap: round; transition: transform .6s var(--spring); transform-origin: 170px 170px; }
.side-pick .boom-f { stroke: var(--brand); stroke-width: 5; stroke-linecap: round; transition: transform .6s var(--spring); transform-origin: 170px 170px; }
.side-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
.side-btns button { height: 56px; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow-1); font-weight: 700; font-size: 16px; display: grid; place-items: center; }
.side-btns button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }

/* ---------- crane picker ---------- */
.cur-crane { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 16px; border-radius: var(--r-l); background: var(--card); box-shadow: var(--shadow-1); position: relative; overflow: hidden; }
.cur-crane::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--bc, var(--brand)); }
.cur-crane .mk { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.cur-crane .md { font-family: var(--f-disp); font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.cur-crane .cl { font-family: var(--f-num); font-size: 40px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.cur-crane .cl small { font-size: 18px; color: var(--ink-2); margin-left: 2px; }
.cur-crane .spec { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--ink-2); }
.cur-crane .spec b { color: var(--ink); font-weight: 650; }
.search { position: relative; }
.search input { width: 100%; height: 44px; border: 0; border-radius: 12px; background: var(--fill); padding: 0 14px 0 40px; font-size: 17px; }
.search svg { position: absolute; left: 12px; top: 12px; color: var(--ink-3); }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.cc { position: relative; display: grid; gap: 4px; padding: 12px 12px 12px 16px; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow-1); text-align: left; overflow: hidden; }
.cc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--bc, var(--brand)); }
.cc .t { font-family: var(--f-num); font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.cc .t small { font-size: 14px; color: var(--ink-2); margin-left: 1px; }
.cc b { font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc span { font-size: 13px; color: var(--ink-2); }
.cc.on { box-shadow: 0 0 0 2.5px var(--ink), var(--shadow-1); }
.cc .fit { position: absolute; top: 10px; right: 10px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 10px; }
.cc .fit.ok { background: var(--safe-soft); color: var(--safe); } .cc .fit.no { background: var(--stop-soft); color: var(--stop); } .cc .fit.warn { background: var(--warn-soft); color: var(--warn); }

/* ---------- tiles for objects / load types ---------- */
.otiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.ot { display: grid; justify-items: center; gap: 6px; padding: 14px 6px 10px; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow-1); font-size: 13px; font-weight: 600; text-align: center; color: var(--ink); }
.ot svg { color: var(--ink-2); }
.ot[aria-pressed="true"] { background: var(--ink); color: var(--card); } .ot[aria-pressed="true"] svg { color: var(--card); }

/* ---------- tackle cards ---------- */
.tk { display: grid; gap: 8px; padding: 12px; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow-1); }
.tk + .tk { margin-top: 8px; }
.tk-h { display: flex; align-items: center; gap: 8px; }
.tk-h .n { width: 26px; height: 26px; border-radius: 8px; background: var(--fill); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.tk-h input { flex: 1; min-width: 0; height: 36px; border: 0; background: transparent; font-size: 16px; font-weight: 600; }
.tk-h button { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); }
.tk-h button:hover { background: var(--fill); }
.tk-f { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tk-f label { display: grid; gap: 2px; padding: 6px 10px; border-radius: 10px; background: var(--card-2); }
.tk-f label span { font-size: 11px; font-weight: 600; color: var(--ink-2); }
.tk-f input, .tk-f select { width: 100%; border: 0; background: transparent; font-size: 16px; font-weight: 650; height: 26px; padding: 0; }
.tk-c { font-size: 13px; color: var(--ink-2); }

/* ---------- checks ---------- */
.ck { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; }
.ck + .ck { border-top: .5px solid var(--hair); }
.ck .ci { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.ck.ok .ci { background: var(--safe-fill); } .ck.warn .ci { background: var(--warn-fill); } .ck.fail .ci { background: var(--stop-fill); } .ck.info .ci { background: var(--info-fill); }
.ck b { display: block; font-size: 16px; font-weight: 600; }
.ck span { display: block; font-size: 14px; color: var(--ink-2); line-height: 1.35; }
.checks-mini .ck { padding: 8px 10px; }
.checks-mini .ck .ci { width: 24px; height: 24px; }
.checks-mini .ck b { font-size: 15px; } .checks-mini .ck span { font-size: 13px; }

/* ---------- pages (plans / fleet / settings) ---------- */
.page { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .5s var(--ease); }
.page.on { transform: none; }
.pg-nav { flex: none; display: flex; align-items: center; gap: 8px; height: calc(var(--top-h) + var(--sat)); padding: var(--sat) calc(12px + var(--sar)) 0 calc(8px + var(--sal)); background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px); border-bottom: .5px solid var(--glass-line); }
.pg-nav .back { height: 40px; padding: 0 12px 0 4px; display: inline-flex; align-items: center; gap: 2px; color: var(--info); font-size: 17px; font-weight: 500; border-radius: 10px; }
.pg-nav .back:hover { background: var(--fill); }
.pg-nav .t { font-weight: 650; font-size: 17px; }
.pg-b { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 8px calc(16px + var(--sar)) calc(40px + var(--sab)) calc(16px + var(--sal)); }
.pg-in { max-width: 980px; margin: 0 auto; }
.pg-in.narrow { max-width: 680px; }
.pg-title { margin: 14px 4px 18px; font-family: var(--f-disp); font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.pg-title small { display: block; margin-top: 6px; font-family: var(--f-ui); font-size: 15px; font-weight: 400; color: var(--ink-2); letter-spacing: 0; line-height: 1.4; }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.pcard { display: grid; gap: 10px; padding: 16px; border-radius: var(--r-l); background: var(--card); box-shadow: var(--shadow-1); text-align: left; }
.pcard h4 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.2; }
.pcard p { margin: 0; font-size: 14px; color: var(--ink-2); }
.pcard .row3 { display: flex; gap: 14px; font-size: 14px; color: var(--ink-2); }
.pcard .row3 b { color: var(--ink); }
.stp { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 13px; font-weight: 700; }
.stp.ok { background: var(--safe-soft); color: var(--safe); } .stp.warn { background: var(--warn-soft); color: var(--warn); } .stp.fail { background: var(--stop-soft); color: var(--stop); }
.split { display: grid; gap: 16px; }
@media (min-width: 900px) { .split { grid-template-columns: 300px minmax(0, 1fr); align-items: start; } .split > .stick { position: sticky; top: 0; max-height: calc(100vh - 140px); overflow-y: auto; } }
.chart-preview { overflow: auto; max-height: 320px; border-radius: 10px; background: var(--card-2); }
.chart-preview table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.chart-preview th, .chart-preview td { padding: 4px 8px; text-align: right; border-bottom: .5px solid var(--hair); white-space: nowrap; }
.chart-preview thead th { position: sticky; top: 0; background: var(--card); }
.thumb { max-width: 100%; max-height: 160px; border-radius: 10px; background: #fff; }
.code { width: 100%; min-height: 160px; border: 0; border-radius: 10px; background: var(--card-2); padding: 10px 12px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; resize: vertical; }

/* ---------- legacy dialog skin (file import, crane body import) ---------- */
.wiz-back { position: fixed; inset: 0; z-index: 80; background: var(--scrim); display: grid; place-items: end center; animation: fadeIn .3s var(--ease); }
@media (min-width: 700px) { .wiz-back { place-items: center; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.wiz { width: min(620px, 100%); max-height: calc(100% - 40px); overflow: auto; background: var(--bg); border-radius: var(--r-l) var(--r-l) 0 0; box-shadow: var(--shadow-3); animation: up .5s var(--ease); }
@media (min-width: 700px) { .wiz { border-radius: var(--r-l); } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.wiz-body { padding: 22px 20px calc(22px + var(--sab)); display: grid; gap: 14px; }
.wiz-body h2 { margin: 0; font-family: var(--f-disp); font-size: 24px; font-weight: 750; letter-spacing: -.02em; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.hint { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.4; }
.errs { color: var(--stop); font-size: 14px; }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.row.r3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .row.r1 { grid-template-columns: minmax(0, 1fr); }
.f { display: grid; gap: 4px; min-width: 0; }
.fl { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.f input, .f select, .f textarea { width: 100%; min-height: 44px; border: 0; border-radius: 10px; background: var(--card); padding: 0 12px; font-size: 16px; box-shadow: var(--shadow-1); }
.f textarea { padding: 10px 12px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; min-height: 40px; }
.check input[type=checkbox] { -webkit-appearance: auto; appearance: auto; width: 20px; height: 20px; accent-color: var(--ink); }
.layers { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 2px 10px; max-height: 260px; overflow: auto; padding: 8px 12px; border-radius: 12px; background: var(--card); }
.layers small { color: var(--ink-3); margin-left: auto; }
.dxf-prev { height: min(52vh, 460px); border-radius: 12px; background: #0d0f12; overflow: hidden; }
.dxf-prev svg { width: 100%; height: 100%; cursor: crosshair; }
.steps-mini { display: flex; flex-wrap: wrap; gap: 6px; }
.steps-mini span { padding: 6px 12px; border-radius: 14px; background: var(--fill); font-size: 13px; font-weight: 600; color: var(--ink-2); }
.steps-mini span.on { background: var(--ink); color: var(--card); } .steps-mini span.done { background: var(--safe-soft); color: var(--safe); }

/* ---------- toast ---------- */
.toast { position: fixed; z-index: 100; left: 50%; top: calc(var(--sat) + 10px); transform: translateX(-50%); max-width: min(520px, calc(100% - 24px)); padding: 12px 18px; border-radius: 18px; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px); box-shadow: var(--shadow-3), 0 0 0 .5px var(--glass-line); font-size: 15px; font-weight: 600; text-align: center; animation: toastIn .5s var(--ease); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -16px) scale(.96); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }

/* ---------- login ---------- */
#login { position: fixed; inset: 0; z-index: 200; background: #05070a; color: #f5f5f7; overflow: hidden; }
#login .lg3d { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s var(--ease); }
#login.ready .lg3d { opacity: 1; }
#login .lg-veil { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 100%, rgba(0,0,0,.85), rgba(0,0,0,.2) 60%, rgba(0,0,0,.05)); pointer-events: none; }
#login .lg-in { position: absolute; inset: auto 0 0 0; display: grid; justify-items: center; gap: 22px; padding: 24px 20px calc(28px + var(--sab)); }
@media (min-width: 900px) { #login .lg-in { inset: 0 auto 0 0; width: 520px; align-content: center; justify-items: start; padding: 48px 56px; background: linear-gradient(90deg, rgba(0,0,0,.72), rgba(0,0,0,0)); } }
.lg-mark { display: flex; align-items: center; gap: 12px; }
.lg-mark .mk { width: 46px; height: 46px; border-radius: 13px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; }
.lg-mark b { font-size: 15px; font-weight: 650; letter-spacing: .02em; } .lg-mark small { display: block; font-size: 13px; color: rgba(245,245,247,.6); }
#login h1 { margin: 0; font-family: var(--f-disp); font-size: clamp(38px, 7vw, 60px); font-weight: 800; letter-spacing: -.045em; line-height: .98; text-align: center; }
@media (min-width: 900px) { #login h1 { text-align: left; } }
#login h1 em { font-style: normal; color: var(--brand); }
.lg-card { width: min(400px, 100%); display: grid; gap: 10px; padding: 16px; border-radius: 26px; background: rgba(30, 30, 34, .55); -webkit-backdrop-filter: saturate(160%) blur(26px); backdrop-filter: saturate(160%) blur(26px); box-shadow: 0 0 0 .5px rgba(255,255,255,.12), 0 30px 80px rgba(0,0,0,.5); }
.lg-f { position: relative; display: flex; align-items: center; height: 56px; border-radius: 16px; background: rgba(255,255,255,.08); padding: 0 14px; gap: 10px; }
.lg-f svg { color: rgba(245,245,247,.55); }
.lg-f input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: #fff; font-size: 18px; font-weight: 500; }
.lg-f input::placeholder { color: rgba(245,245,247,.45); }
.lg-users { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lg-u { display: grid; justify-items: center; gap: 6px; padding: 12px 4px 10px; border-radius: 16px; background: rgba(255,255,255,.06); color: rgba(245,245,247,.85); font-size: 14px; font-weight: 600; }
.lg-u .av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; font-weight: 750; background: rgba(255,255,255,.12); color: #fff; }
.lg-u[aria-pressed="true"] { background: rgba(255,194,14,.16); color: #fff; box-shadow: inset 0 0 0 1.5px var(--brand); }
.lg-u[aria-pressed="true"] .av { background: var(--brand); color: var(--brand-ink); }
.lg-go { height: 56px; border-radius: 16px; background: var(--brand); color: var(--brand-ink); font-size: 18px; font-weight: 750; display: flex; align-items: center; justify-content: center; gap: 8px; }
.lg-err { min-height: 20px; text-align: center; color: #ff8a80; font-size: 14px; font-weight: 600; }
.lg-card.bad { animation: shake .5s var(--ease); }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(3px); } }
.lg-keep { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px; font-size: 15px; color: rgba(245,245,247,.8); }
.lg-foot { font-size: 12px; color: rgba(245,245,247,.45); text-align: center; }
#login.out { opacity: 0; transform: scale(1.04); transition: opacity .7s var(--ease), transform .9s var(--ease); pointer-events: none; }
#splash { position: fixed; inset: 0; z-index: 300; background: #05070a; display: grid; place-items: center; transition: opacity .6s var(--ease); }
#splash.gone { opacity: 0; pointer-events: none; }
#splash .mk { width: 64px; height: 64px; border-radius: 18px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; animation: breathe 1.4s var(--ease) infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* ---------- coach marks (first run) ---------- */
.coach { position: fixed; z-index: 90; inset: 0; pointer-events: none; }
.coach .bub { position: absolute; pointer-events: auto; max-width: 300px; padding: 14px 16px; border-radius: 18px; background: var(--ink); color: var(--card); box-shadow: var(--shadow-3); font-size: 15px; line-height: 1.4; animation: toastIn .5s var(--ease); }
.coach .bub b { display: block; font-size: 17px; margin-bottom: 4px; }
.coach .bub .btns { margin-top: 10px; justify-content: flex-end; }
.coach .bub .btn { height: 38px; font-size: 15px; background: rgba(255,255,255,.16); color: inherit; }
.coach .bub .btn.pri { background: var(--brand); color: var(--brand-ink); }
.coach .ring-hl { position: absolute; border-radius: 18px; box-shadow: 0 0 0 4px var(--brand), 0 0 0 9999px rgba(0,0,0,.45); transition: all .5s var(--ease); }

/* ---------- v8: outrigger legs ---------- */
.legs-wrap { display: grid; place-items: center; margin: 2px 0 10px; }
.legs-pic { width: min(340px, 100%); height: auto; color: var(--ink); }
.legs-pic .poly { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 5 4; }
.legs-pic .kern { fill: var(--safe-soft); stroke: none; }
.legs-pic .beam { stroke: var(--ink-2); stroke-width: 7; stroke-linecap: round; opacity: .55; }
.legs-pic .beam.half { stroke: var(--warn-fill); opacity: .9; }
.legs-pic .body { fill: var(--card); stroke: var(--ink-2); stroke-width: 1.5; }
.legs-pic .cab { fill: var(--fill-2); stroke: none; }
.legs-pic .cabt { font: 700 10px var(--f-ui); fill: var(--ink-2); }
.legs-pic .boom { stroke: var(--brand); stroke-width: 9; stroke-linecap: round; }
.legs-pic .hk { fill: var(--brand); stroke: var(--brand-ink); stroke-width: 2; }
.legs-pic .hkt { font: 650 12px var(--f-ui); fill: var(--ink-2); }
.legs-pic .ring { fill: var(--card); stroke: var(--ink); stroke-width: 2; }
.legs-pic .cog circle { fill: var(--safe-fill); stroke: #fff; stroke-width: 2; } .legs-pic .cog path { stroke: var(--ink); stroke-width: 1.5; }
.legs-pic .cog.warn circle { fill: var(--warn-fill); } .legs-pic .cog.fail circle { fill: var(--stop-fill); }
.legs-pic .pad circle { fill: var(--brand); stroke: var(--brand-ink); stroke-width: 2; }
.legs-pic .pad.ok circle { fill: var(--safe-fill); } .legs-pic .pad.warn circle { fill: var(--warn-fill); } .legs-pic .pad.fail circle { fill: var(--stop-fill); }
.legs-pic .pad.lift circle { fill: var(--card); stroke: var(--ink-3); stroke-dasharray: 4 3; }
.legs-pic .pad.man circle { fill: var(--stop-soft); stroke: var(--stop-fill); stroke-width: 3; stroke-dasharray: 5 3; }
.legs-pic .pid { font: 800 11px var(--f-ui); fill: var(--brand-ink); } .legs-pic .pad.lift .pid, .legs-pic .pad.man .pid { fill: var(--ink); }
