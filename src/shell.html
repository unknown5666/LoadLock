<meta charset="utf-8">
<title>FHE Lift Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap">
<style>
/* FHE Lift Planner — "night shift" control-room theme. One dark theme on purpose: the studio is model space (dark, AutoCAD-style),
   the A1 sheet view is paper space (white). Sharp corners, hairlines, CAD corner ticks, amber = signal, cyan = measure/interactive. */
:root {
  --bg: #080b0f; --bg2: #0b0f14; --s1: #0e1217; --s2: #12171d; --s3: #182029; --s4: #1f2934;
  --l1: #1a222b; --l2: #25303b; --l3: #34414e;
  --t1: #edf1f4; --t2: #b9c3cc; --t3: #8a96a3; --t4: #75818e;
  --amber: #ffb81c; --amber2: #ffd166; --amber-ink: #160f02; --amber-soft: rgba(255, 184, 28, .1); --amber-line: rgba(255, 184, 28, .42); --amber-glow: 0 0 18px rgba(255, 184, 28, .35);
  --cyan: #4fe0ff; --cyan-soft: rgba(79, 224, 255, .1); --cyan-line: rgba(79, 224, 255, .4);
  --ok: #2fe08a; --ok-soft: rgba(47, 224, 138, .1); --warn: #ffb81c; --warn-soft: rgba(255, 184, 28, .11); --fail: #ff4b4b; --fail-soft: rgba(255, 75, 75, .11);
  --magenta: #e040e0;
  --f-ui: "Archivo", "Helvetica Neue", "Segoe UI", Arial, sans-serif; --f-mono: "Martian Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1); --ease-io: cubic-bezier(.65, 0, .35, 1);
  --r: 2px; --top-h: 52px; --rail-w: 64px; --drawer-w: 352px; --insp-w: 292px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--t1); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
::selection { background: rgba(255, 184, 28, .3); }
.mono, .num { font-family: var(--f-mono); font-stretch: 87.5%; font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #1f2934; border: 3px solid transparent; background-clip: padding-box; border-radius: 6px; } ::-webkit-scrollbar-thumb:hover { background-color: #2c3946; } ::-webkit-scrollbar-track { background: transparent; }
.grain { position: fixed; inset: 0; pointer-events: none; z-index: 200; opacity: .055; mix-blend-mode: overlay; background-size: 160px 160px; }

/* ======================= LOGIN ======================= */
.lg { position: fixed; inset: 0; z-index: 100; background: #03060b; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); grid-template-rows: auto minmax(0, 1fr) auto auto;
  column-gap: clamp(24px, 5vw, 96px); padding: max(22px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left)); }
.lg-3d, .lg-fallback { position: absolute; inset: 0; }
.lg-3d { opacity: 0; transition: opacity 1.8s var(--ease); }
.lg.ready .lg-3d { opacity: 1; }
.lg-fallback { display: none; } .lg.no3d .lg-fallback { display: block; } .lg-fallback svg { width: 100%; height: 100%; }
.lg-shade { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 62% 42%, transparent 35%, rgba(3, 6, 11, .5) 78%, rgba(3, 6, 11, .9) 100%), linear-gradient(90deg, rgba(3, 6, 11, .9) 0%, rgba(3, 6, 11, .72) 26%, rgba(3, 6, 11, .3) 44%, transparent 56%, rgba(3, 6, 11, .2) 74%, rgba(3, 6, 11, .66) 100%), linear-gradient(0deg, rgba(3, 6, 11, .92) 0%, transparent 26%), linear-gradient(180deg, rgba(3, 6, 11, .55) 0%, transparent 18%); }
.lg-scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
.lg-sweep { position: absolute; left: 0; right: 0; top: 0; height: 120px; pointer-events: none; background: linear-gradient(180deg, transparent, rgba(79, 224, 255, .05) 70%, rgba(79, 224, 255, .22) 99%, transparent); mix-blend-mode: screen; animation: lgSweep 9s cubic-bezier(.45, 0, .55, 1) infinite; opacity: .8; }
@keyframes lgSweep { 0% { transform: translateY(-140px); } 60%, 100% { transform: translateY(110vh); } }
.lg h1 em { background: linear-gradient(105deg, transparent 0 42%, rgba(255, 209, 102, .95) 49%, rgba(255, 255, 255, .9) 50%, rgba(255, 209, 102, .95) 51%, transparent 58% 100%); background-size: 260% 100%; background-repeat: no-repeat; -webkit-background-clip: text; background-clip: text; animation: glint 5.5s ease-in-out 2.2s infinite; }
@keyframes glint { 0% { background-position: 130% 0; } 40%, 100% { background-position: -40% 0; } }
.lg-card::after { content: ""; position: absolute; top: -1px; left: 0; width: 34%; height: 2px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .95), transparent); mix-blend-mode: screen; animation: cardSweep 4.2s ease-in-out infinite; pointer-events: none; }
@keyframes cardSweep { 0% { transform: translateX(-110%); } 55%, 100% { transform: translateX(300%); } }
.lg-hud-sim b::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; vertical-align: 2px; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: led 1.4s steps(2) infinite; }
.lg-frame i { position: absolute; width: 22px; height: 22px; border-color: rgba(255, 184, 28, .55); border-style: solid; border-width: 0; pointer-events: none; }
.lg-frame i:nth-child(1) { top: 12px; left: 12px; border-top-width: 1px; border-left-width: 1px; } .lg-frame i:nth-child(2) { top: 12px; right: 12px; border-top-width: 1px; border-right-width: 1px; }
.lg-frame i:nth-child(3) { bottom: 12px; left: 12px; border-bottom-width: 1px; border-left-width: 1px; } .lg-frame i:nth-child(4) { bottom: 12px; right: 12px; border-bottom-width: 1px; border-right-width: 1px; }
.lg > header, .lg > section, .lg > form, .lg > aside, .lg > footer { position: relative; z-index: 2; }
.lg-top { grid-column: 1 / -1; grid-row: 1; display: flex; justify-content: space-between; align-items: center; gap: 16px; opacity: 0; transform: translateY(-8px); transition: opacity .9s var(--ease) .2s, transform .9s var(--ease) .2s; }
.lg-brand { display: flex; align-items: center; gap: 12px; color: var(--amber); }
.fhe-mark { width: 34px; height: 34px; flex: none; }
.lg-brand b { display: block; color: var(--t1); font-weight: 800; letter-spacing: .14em; font-size: 13px; }
.lg-brand span { display: block; color: var(--t3); font-size: 11px; letter-spacing: .04em; }
.lg-loc { display: flex; gap: 18px; font-family: var(--f-mono); font-stretch: 87.5%; font-size: 10.5px; color: var(--t3); letter-spacing: .04em; }
.lg-loc span:last-child { color: var(--t2); }
.lg-hero { grid-column: 1; grid-row: 2; align-self: center; max-width: 780px; opacity: 0; transform: translateY(14px); transition: opacity 1.2s var(--ease) .35s, transform 1.2s var(--ease) .35s; }
.lg-eyebrow { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; font-family: var(--f-mono); font-stretch: 87.5%; font-size: 10.5px; letter-spacing: .22em; color: var(--amber); }
.lg-eyebrow i { width: 42px; height: 1px; background: var(--amber-line); }
.lg-eyebrow span:last-child { color: var(--t3); letter-spacing: .1em; }
.lg h1 { margin: 0; font-weight: 800; font-stretch: 72%; font-size: clamp(40px, 5vw, 80px); line-height: .94; letter-spacing: -.01em; text-transform: uppercase; color: var(--t1); text-wrap: balance; }
.lg h1 em { font-style: normal; color: transparent; -webkit-text-stroke: 1.2px var(--amber); text-shadow: 0 0 28px rgba(255, 184, 28, .25); }
.lg-sub { margin: 22px 0 0; max-width: 46ch; color: var(--t2); font-size: 15px; line-height: 1.55; }
.lg-stats { display: flex; gap: 0; margin: 30px 0 0; border-top: 1px solid rgba(255, 255, 255, .08); max-width: 520px; }
.lg-stats div { flex: 1; padding: 12px 14px 0 0; } .lg-stats div + div { padding-left: 14px; border-left: 1px solid rgba(255, 255, 255, .08); }
.lg-stats dt { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--t3); font-weight: 700; }
.lg-stats dd { margin: 4px 0 0; font-family: var(--f-mono); font-stretch: 87.5%; font-size: 14px; color: var(--t1); }
.lg-card { grid-column: 2; grid-row: 2 / span 2; align-self: center; background: linear-gradient(180deg, rgba(14, 18, 23, .78), rgba(10, 13, 17, .86)); border: 1px solid rgba(255, 255, 255, .09); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  padding: 24px 24px 22px; display: grid; gap: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .05); opacity: 0; transform: translateY(18px) scale(.985); transition: opacity 1s var(--ease) .55s, transform 1s var(--ease) .55s; }
.lg-card::before { content: ""; position: absolute; left: -1px; right: -1px; top: -1px; height: 2px; background: linear-gradient(90deg, var(--amber), rgba(255, 184, 28, 0) 70%); }
.lg-card-h { display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--t2); font-weight: 700; }
.lg-led { width: 7px; height: 7px; background: var(--amber); box-shadow: 0 0 10px var(--amber); animation: led 1.6s steps(2) infinite; }
@keyframes led { 50% { opacity: .25; } }
.lg-field { display: grid; gap: 7px; }
.lg-lab { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--t3); font-weight: 700; }
.lg-user { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; background: rgba(255, 255, 255, .03); border: 1px solid rgba(255, 255, 255, .08); color: var(--t3); }
.lg-av { width: 34px; height: 34px; display: grid; place-items: center; background: var(--amber); color: var(--amber-ink); font-weight: 900; font-size: 15px; }
.lg-user b { display: block; color: var(--t1); font-size: 15px; font-weight: 700; } .lg-user small { display: block; color: var(--t3); font-size: 11.5px; }
.lg-pass { position: relative; display: block; }
.lg-pass input { width: 100%; height: 50px; background: rgba(3, 6, 11, .6); border: 1px solid rgba(255, 255, 255, .12); color: var(--t1); padding: 0 48px 0 14px; font-family: var(--f-mono); font-size: 20px; letter-spacing: .4em; outline: none; transition: border-color .2s, box-shadow .2s; border-radius: 0; }
.lg-pass input::placeholder { color: var(--t4); }
.lg-pass input:focus { border-color: var(--amber-line); box-shadow: 0 0 0 3px rgba(255, 184, 28, .12), var(--amber-glow); }
.lg-eye { position: absolute; right: 6px; top: 7px; width: 36px; height: 36px; border: 0; background: none; color: var(--t3); display: grid; place-items: center; }
.lg-eye:hover { color: var(--t1); }
.lg-stay { display: flex; gap: 9px; align-items: center; color: var(--t2); font-size: 12.5px; cursor: pointer; }
.lg-stay input { width: 15px; height: 15px; accent-color: var(--amber); margin: 0; }
.lg-go { position: relative; height: 50px; border: 0; background: var(--amber); color: var(--amber-ink); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-weight: 800; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; overflow: hidden; transition: filter .2s, transform .2s var(--ease); }
.lg-go::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .45) 50%, transparent 70%); transform: translateX(-120%); transition: transform .9s var(--ease); }
.lg-go:hover::after { transform: translateX(120%); } .lg-go:hover { filter: brightness(1.05); } .lg-go:active { transform: translateY(1px); }
.lg-err { margin: -6px 0 0; min-height: 16px; color: var(--fail); font-size: 12.5px; font-weight: 600; }
.lg-card.bad { animation: shake .42s var(--ease); } .lg-card.bad .lg-pass input { border-color: rgba(255, 75, 75, .6); }
@keyframes shake { 15%, 55% { transform: translateX(-7px); } 35%, 75% { transform: translateX(6px); } 90% { transform: translateX(-2px); } }
.lg-card.ok .lg-go { background: var(--ok); } .lg-card.ok .lg-led { background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: none; }
.lg-boot { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-family: var(--f-mono); font-stretch: 87.5%; font-size: 11px; color: var(--t2); }
.lg-boot:empty { display: none; }
.lg-boot li { animation: bootIn .3s var(--ease) both; } .lg-boot li::before { content: "▸ "; color: var(--ok); }
@keyframes bootIn { from { opacity: 0; transform: translateX(-6px); } }
.lg-hud { grid-column: 1; grid-row: 3; align-self: end; display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 18px; border: 1px solid rgba(255, 255, 255, .07); background: rgba(3, 6, 11, .45); backdrop-filter: blur(6px); width: max-content; max-width: 100%; opacity: 0; transition: opacity 1s var(--ease) .9s; }
.lg-hud div { padding: 8px 14px; display: grid; grid-template-columns: auto auto; column-gap: 3px; align-items: baseline; min-width: 92px; }
.lg-hud div + div { border-left: 1px solid rgba(255, 255, 255, .07); }
.lg-hud span { grid-column: 1 / -1; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--t3); font-weight: 700; }
.lg-hud b { font-family: var(--f-mono); font-stretch: 87.5%; font-weight: 500; font-size: 17px; color: var(--t1); }
.lg-hud small { color: var(--t3); font-size: 11px; }
.lg-hud-sim b { color: var(--cyan); font-size: 13px; letter-spacing: .1em; }
.lg-tag { position: absolute; left: 0; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 5px 9px 5px 7px; background: rgba(3, 6, 11, .66); border: 1px solid var(--cyan-line); color: var(--t1); font-family: var(--f-mono); font-stretch: 87.5%; font-size: 10.5px; pointer-events: none; opacity: 0; transition: opacity .4s; will-change: transform; white-space: nowrap; }
.lg-tag b { color: var(--cyan); font-weight: 600; letter-spacing: .14em; }
.lg-tag-dot { width: 6px; height: 6px; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.lg-foot { grid-column: 1 / -1; grid-row: 4; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--t3); letter-spacing: .04em; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .06); opacity: 0; transition: opacity 1s var(--ease) 1s; }
.lg-credit { color: var(--t2); letter-spacing: .12em; text-transform: uppercase; font-size: 10.5px; }
.lg-credit b { color: var(--amber); font-weight: 700; letter-spacing: .14em; }
.lg-dot { width: 3px; height: 3px; background: var(--t4); }
.lg.in .lg-top, .lg.in .lg-hero, .lg.in .lg-card { opacity: 1; transform: none; } .lg.in .lg-hud, .lg.in .lg-foot { opacity: 1; }
.lg.out { pointer-events: none; animation: lgOut .8s var(--ease-io) forwards; }
@keyframes lgOut { to { opacity: 0; filter: blur(6px) brightness(1.4); } }
#app { visibility: hidden; } body.on #app { visibility: visible; }
#splash { position: fixed; inset: 0; z-index: 99; background: #03060b; display: grid; place-items: center; color: var(--amber); transition: opacity .6s var(--ease); }
#splash.gone { opacity: 0; pointer-events: none; }
#splash div { display: grid; justify-items: center; gap: 16px; }
#splash .fhe-mark { width: 54px; height: 54px; animation: splashPulse 1.6s var(--ease-io) infinite; }
#splash i { display: block; width: 140px; height: 1px; background: linear-gradient(90deg, transparent, var(--amber), transparent); background-size: 200% 100%; animation: splashBar 1.2s linear infinite; }
#splash span { font-family: var(--f-mono); font-size: 10px; letter-spacing: .3em; color: var(--t3); }
@keyframes splashPulse { 50% { opacity: .45; } } @keyframes splashBar { from { background-position: 100% 0; } to { background-position: -100% 0; } }
body.app-in #app { animation: appIn .9s var(--ease) both; }
@keyframes appIn { from { opacity: 0; transform: scale(1.015); filter: blur(4px); } }

/* ======================= APP FRAME ======================= */
#app { position: fixed; inset: 0; display: grid; grid-template-rows: var(--top-h) minmax(0, 1fr); background: var(--bg); }
.top { display: flex; align-items: center; gap: 12px; padding: 0 12px 0 max(0px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); background: linear-gradient(180deg, #0c1015, #090c10); border-bottom: 1px solid var(--l1); min-width: 0; position: relative; z-index: 20; }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, var(--amber-line), transparent 22%); pointer-events: none; }
.brand { display: flex; align-items: center; gap: 10px; width: var(--rail-w); justify-content: center; flex: none; color: var(--amber); }
.brand .fhe-mark { width: 28px; height: 28px; }
.brand-txt { display: grid; line-height: 1.05; margin-left: -4px; }
.brand-txt b { font-weight: 800; letter-spacing: .12em; font-size: 12.5px; color: var(--t1); }
.brand-txt span { font-size: 9px; letter-spacing: .22em; color: var(--t3); font-weight: 600; }
.pname { display: grid; min-width: 0; flex: 0 1 300px; }
.pname input { background: transparent; border: 1px solid transparent; color: var(--t1); font-size: 14.5px; font-weight: 650; padding: 2px 6px; margin-left: -7px; min-width: 0; width: 100%; text-overflow: ellipsis; border-radius: var(--r); }
.pname input:hover { border-color: var(--l2); } .pname input:focus { border-color: var(--amber-line); background: var(--bg2); outline: none; }
.pname small { font-family: var(--f-mono); font-stretch: 87.5%; font-size: 10px; color: var(--t3); padding-left: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pname small .dirty { color: var(--amber); }
.vsw { display: flex; position: relative; margin: 0 auto; border: 1px solid var(--l2); background: var(--bg2); padding: 2px; gap: 0; flex: none; }
.vsw button { position: relative; z-index: 1; border: 0; background: none; color: var(--t3); height: 30px; padding: 0 14px; font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; display: flex; align-items: center; gap: 7px; transition: color .2s; }
.vsw button:hover { color: var(--t1); }
.vsw button[aria-selected="true"] { color: var(--amber); }
.vsw kbd { font-family: var(--f-mono); font-size: 9px; color: var(--t4); border: 1px solid var(--l2); padding: 0 4px; line-height: 14px; }
.vsw-ind { position: absolute; z-index: 0; top: 2px; bottom: 2px; background: var(--s3); border-bottom: 1px solid var(--amber); transition: left .26s var(--ease), width .26s var(--ease); }
.top-r { display: flex; align-items: center; gap: 8px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px; border: 1px solid var(--l2); background: var(--s1); color: var(--t2); font-size: 11.5px; white-space: nowrap; border-radius: var(--r); transition: border-color .2s, color .2s; }
.chip:hover { border-color: var(--l3); color: var(--t1); }
.chip .num { font-size: 11px; color: var(--t1); }
.chip.ok { border-color: rgba(47, 224, 138, .35); } .chip.warn { border-color: var(--amber-line); } .chip.fail { border-color: rgba(255, 75, 75, .5); }
.chip .led { width: 6px; height: 6px; background: var(--t4); flex: none; }
.chip.ok .led { background: var(--ok); box-shadow: 0 0 8px var(--ok); } .chip.warn .led { background: var(--warn); box-shadow: 0 0 8px var(--warn); } .chip.fail .led { background: var(--fail); box-shadow: 0 0 8px var(--fail); animation: led 1s steps(2) infinite; }
.user { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 4px; border: 1px solid transparent; background: none; color: var(--t2); }
.user:hover { border-color: var(--l2); }
.user .av { width: 24px; height: 24px; display: grid; place-items: center; background: var(--amber); color: var(--amber-ink); font-weight: 900; font-size: 11.5px; }
.user b { font-size: 12px; font-weight: 650; color: var(--t1); }

/* buttons */
.btn { height: 32px; padding: 0 12px; border: 1px solid var(--l2); background: var(--s2); color: var(--t1); border-radius: var(--r); font-weight: 650; font-size: 12px; letter-spacing: .02em; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; transition: background .15s, border-color .15s, color .15s, filter .15s; }
.btn:hover { border-color: var(--l3); background: var(--s3); }
.btn svg { flex: none; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 11.5px; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--t2); } .btn.ghost:hover { border-color: var(--l2); color: var(--t1); }
.btn.line { background: transparent; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 11.5px; }
.btn.xs { height: 22px; padding: 0 7px; font-size: 10.5px; }
.btn.wide { width: 100%; }
.btn.icon { width: 32px; padding: 0; } .btn.sm.icon { width: 26px; }

/* menus */

.menu-pop { position: absolute; top: calc(100% + 6px); right: 0; z-index: 60; min-width: 230px; background: var(--s2); border: 1px solid var(--l2); padding: 5px; box-shadow: 0 18px 50px rgba(0, 0, 0, .55); display: grid; animation: pop .18s var(--ease); }

.menu-pop .credit { padding: 8px 10px; font-size: 11px; color: var(--t3); border-top: 1px solid var(--l1); margin-top: 4px; } .menu-pop .credit b { color: var(--amber); }

/* work area */

@keyframes drIn { from { opacity: 0; transform: translateX(-6px); } }

.rail { background: #090c10; border-right: 1px solid var(--l1); display: flex; flex-direction: column; padding: 8px 0 max(8px, env(safe-area-inset-bottom)); padding-left: env(safe-area-inset-left); gap: 2px; z-index: 6; }

.ri .bdg.warn { background: var(--warn); } .ri .bdg.ok { display: none; }
.drawer { background: var(--s1); border-right: 1px solid var(--l1); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.dr-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--l1); min-width: var(--drawer-w); }
.dr-idx { font-family: var(--f-mono); font-stretch: 87.5%; font-size: 10px; color: var(--amber); border: 1px solid var(--amber-line); padding: 1px 5px; }
.dr-head h2 { margin: 0; font-weight: 800; font-stretch: 75%; font-size: 21px; letter-spacing: .04em; text-transform: uppercase; flex: 1; }
.dr-head .dr-sub { display: block; font-stretch: 100%; font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--t3); font-weight: 500; margin-top: 1px; }
.dr-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 16px 28px; min-width: var(--drawer-w); overscroll-behavior: contain; }
.dr-foot { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--l1); min-width: var(--drawer-w); background: var(--s1); }
.dr-foot .sp { flex: 1; }

/* groups & fields */
.grp { padding: 16px 0 4px; display: grid; gap: 10px; border-bottom: 1px solid var(--l1); }
.grp:last-child { border-bottom: 0; }
.gh { display: flex; align-items: center; gap: 8px; min-height: 18px; }

.gh .tag { font-family: var(--f-mono); font-stretch: 87.5%; font-size: 10px; color: var(--t3); }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.row.r3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .row.r1 { grid-template-columns: minmax(0, 1fr); } .row.r4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.f { display: grid; gap: 5px; min-width: 0; align-content: end; }
.fl { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.fi { position: relative; display: block; min-width: 0; }
.fi > i { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-style: normal; font-family: var(--f-mono); font-stretch: 87.5%; font-size: 10.5px; color: var(--t3); pointer-events: none; }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=search], input[type=password], select, textarea {
  width: 100%; min-width: 0; height: 32px; background: var(--bg2); border: 1px solid var(--l2); border-radius: var(--r); color: var(--t1); padding: 0 9px; font-size: 13px; transition: border-color .15s, box-shadow .15s, background .15s; }

.check { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--t1); cursor: pointer; min-width: 0; }

.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; } .actions .sp { flex: 1; }
.sub { border: 1px dashed var(--l2); padding: 10px; display: grid; gap: 9px; }
/* segmented */
.seg { display: flex; border: 1px solid var(--l2); background: var(--bg2); padding: 2px; gap: 2px; min-width: 0; }

.seg button:hover { color: var(--t1); }

.seg.sm button { height: 24px; font-size: 10px; padding: 0 7px; }
/* switch */
.tog { position: relative; width: 30px; height: 16px; flex: none; appearance: none; -webkit-appearance: none; margin: 0; background: var(--s4); border: 1px solid var(--l3); cursor: pointer; transition: background .2s; }
.tog::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; background: var(--t3); transition: transform .22s var(--ease), background .2s; }
.tog:checked { background: rgba(255, 184, 28, .25); border-color: var(--amber-line); } .tog:checked::after { transform: translateX(14px); background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.tog:disabled { opacity: .4; }
/* range */
input[type=range].rg { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; --p: 50%; cursor: pointer; }

input[type=range].rg::-moz-range-track { height: 3px; background: var(--s4); } input[type=range].rg::-moz-range-progress { height: 3px; background: var(--amber); }
input[type=range].rg::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 18px; margin-top: -7.5px; background: #0b0f14; border: 2px solid var(--amber); box-shadow: 0 0 10px rgba(255, 184, 28, .35); }

input[type=range].rg:focus-visible { outline: none; } input[type=range].rg:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(79, 224, 255, .35); }
.rg-ticks { position: relative; height: 12px; margin-top: -4px; }
.rg-ticks i { position: absolute; top: 0; width: 1px; height: 5px; background: var(--l3); }
.rg-ticks i.on { background: var(--amber); height: 7px; }
.rg-ticks span { position: absolute; top: 5px; transform: translateX(-50%); font-family: var(--f-mono); font-stretch: 87.5%; font-size: 10px; color: var(--t4); white-space: nowrap; }

/* crane card + picker */
.ccard { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 14px 12px; background: linear-gradient(135deg, var(--s2), var(--s1)); border: 1px solid var(--l2); overflow: hidden; }
.ccard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--bc, var(--amber)); }

.ccard .cl { grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: right; font-family: var(--f-mono); font-stretch: 87.5%; font-size: 30px; line-height: 1; color: var(--amber); text-shadow: var(--amber-glow); }

.ccard dd { margin: 2px 0 0; font-family: var(--f-mono); font-stretch: 87.5%; font-size: 12px; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.cpick { display: grid; gap: 8px; }
.cpick-tools { display: flex; gap: 6px; }
.cpick-tools input { flex: 1; }
.ctiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: max-content; gap: 6px; max-height: 360px; overflow-y: auto; padding-right: 2px; }
.ctile { position: relative; text-align: left; border: 1px solid var(--l2); background: var(--s2); padding: 8px 10px 8px 12px; display: grid; gap: 1px; color: var(--t1); transition: border-color .15s, background .15s; overflow: hidden; }
.ctile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--bc, var(--l3)); }
.ctile:hover { border-color: var(--l3); background: var(--s3); }
.ctile.on { border-color: var(--amber-line); background: var(--amber-soft); }
.ctile .c1 { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.ctile b { font-weight: 750; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctile .t { font-family: var(--f-mono); font-stretch: 87.5%; font-size: 12px; color: var(--amber); }
.ctile small { font-size: 10.5px; color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* telescope detail */

.tsecs { display: grid; gap: 6px; }
.tsec { display: grid; grid-template-columns: 30px minmax(0, 1fr) 64px; gap: 10px; align-items: center; }

.tsec output { font-family: var(--f-mono); font-stretch: 87.5%; font-size: 11px; text-align: right; color: var(--t1); }
.tsec output small { color: var(--t3); }
.tsec.lock { opacity: .5; }
/* accessories */
.accs { display: grid; gap: 1px; background: var(--l1); border: 1px solid var(--l1); }
.acc { background: var(--s1); display: grid; gap: 10px; padding: 10px 12px; }
.acc-h { display: flex; align-items: center; gap: 10px; }
.acc-h b { font-weight: 700; font-size: 12.5px; flex: 1; }
.acc-h small { color: var(--t3); font-size: 11px; font-weight: 500; display: block; }
.acc.on { background: linear-gradient(90deg, rgba(255, 184, 28, .06), var(--s1) 60%); }

/* load tabs */
.ltabs { display: flex; gap: 6px; flex-wrap: wrap; }
.ltab { position: relative; border: 1px solid var(--l2); background: var(--s2); padding: 7px 10px 10px; display: grid; text-align: left; color: var(--t1); min-width: 0; flex: 1 1 120px; }
.ltab b { font-size: 11.5px; font-weight: 700; } .ltab span { font-family: var(--f-mono); font-stretch: 87.5%; font-size: 10.5px; color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ltab[aria-selected="true"] { border-color: var(--amber-line); background: var(--amber-soft); }
.ltab.add { flex: 0 0 44px; place-items: center; font-size: 18px; color: var(--t3); padding: 0; }
.ubar { position: absolute; left: 10px; right: 10px; bottom: 5px; height: 2px; background: var(--s4); overflow: hidden; display: block; }
.ubar > i { display: block; height: 100%; background: var(--ok); } .ubar.warn > i { background: var(--warn); } .ubar.fail > i { background: var(--fail); }
.pos { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 12px; align-items: end; }
.pos input { height: 40px; font-size: 18px; }
.pos .other { margin: 0 0 10px; font-size: 12px; color: var(--t3); } .pos .other b { color: var(--t1); font-family: var(--f-mono); font-stretch: 87.5%; font-weight: 500; }
/* objects */
.otiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.otile { border: 1px solid var(--l2); background: var(--s2); padding: 9px 4px 7px; display: grid; justify-items: center; gap: 5px; font-size: 10px; color: var(--t3); text-align: center; letter-spacing: .02em; line-height: 1.15; transition: border-color .15s, color .15s; }
.otile svg { color: var(--t1); } .otile:hover { border-color: var(--amber-line); color: var(--t1); }

.oitem { border: 1px solid var(--l2); background: var(--s2); }

.oitem > summary span { font-family: var(--f-mono); font-stretch: 87.5%; font-size: 10.5px; color: var(--t3); white-space: nowrap; }
.oitem .x { border: 0; background: none; color: var(--t4); width: 24px; height: 24px; display: grid; place-items: center; } .oitem .x:hover { color: var(--fail); background: var(--fail-soft); }
.obody { padding: 2px 10px 12px; display: grid; gap: 9px; }
/* layout tiles */
.ltiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.lt { border: 1px solid var(--l2); background: var(--s2); padding: 8px; display: grid; gap: 3px; text-align: left; color: var(--t1); transition: border-color .15s; }
.lt:hover { border-color: var(--l3); }
.lt b { font-size: 11.5px; font-weight: 700; } .lt small { font-size: 10.5px; color: var(--t3); }
.lt[aria-checked="true"] { border-color: var(--amber-line); background: var(--amber-soft); }
.lt-ico { width: 100%; height: auto; margin-bottom: 4px; }
.lt-ico .if { fill: #f3f3ee; stroke: none; } .lt-ico .it { fill: none; stroke: #9aa093; stroke-width: .7; } .lt-ico .ig { stroke: #9aa093; stroke-width: .7; fill: none; }
.lt-ico .iq { stroke: #c3c8bc; stroke-width: 1.4; } .lt-ico .ib { stroke: #c28f00; stroke-width: 1.6; fill: none; stroke-linecap: round; } .lt-ico .il { fill: #c000c0; }
/* weather */
.wx-res { display: grid; gap: 1px; background: var(--l1); border: 1px solid var(--l1); }
.wx-res button { border: 0; background: var(--s2); text-align: left; padding: 8px 10px; display: grid; color: var(--t1); }
.wx-res button:hover { background: var(--s3); }
.wx-res button b { font-size: 12.5px; font-weight: 650; } .wx-res button small { font-size: 11px; color: var(--t3); }
.wx-place { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--l2); background: var(--s2); }
.wx-place svg { color: var(--cyan); }
.wx-place b { display: block; font-size: 13px; } .wx-place small { display: block; font-family: var(--f-mono); font-stretch: 87.5%; font-size: 10px; color: var(--t3); }
.wxchart { width: 100%; height: auto; display: block; background: var(--bg2); border: 1px solid var(--l1); }
.wxchart .wx-grid { stroke: #1a222b; stroke-width: 1; } .wxchart .wx-ax { fill: #6b7783; font-family: Martian Mono, monospace; font-size: 10px; } .wxchart .wx-ax.lim { fill: #ff4b4b; }
.wxchart .wx-rain { fill: rgba(79, 224, 255, .22); } .wxchart .wx-rain.storm { fill: rgba(224, 64, 224, .5); }
.wxchart .wx-lim { stroke: #ff4b4b; stroke-width: 1; stroke-dasharray: 4 3; } .wxchart .wx-wind { fill: none; stroke: #ffb81c; stroke-width: 2; } .wxchart .wx-gust { fill: none; stroke: #ffb81c; stroke-width: 1; stroke-dasharray: 3 2; opacity: .7; }
.wxchart .wx-dot { fill: #ffb81c; } .wxchart .wx-dot.over { fill: #ff4b4b; } .wxchart .wx-win { fill: rgba(255, 184, 28, .07); stroke: rgba(255, 184, 28, .4); stroke-dasharray: 2 2; }
.wxchart .wx-hit { cursor: pointer; } .wxchart .wx-hit:hover { fill: rgba(255, 255, 255, .04); }
.wx-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 10.5px; color: var(--t3); }
.wx-legend i { display: inline-block; width: 14px; height: 2px; background: var(--amber); vertical-align: middle; margin-right: 6px; }
.wx-legend i.g { background: repeating-linear-gradient(90deg, var(--amber) 0 3px, transparent 3px 5px); } .wx-legend i.r { height: 8px; background: rgba(79, 224, 255, .3); } .wx-legend i.l { background: repeating-linear-gradient(90deg, var(--fail) 0 4px, transparent 4px 7px); }
.wx-sum { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--l2); }

/* inspector */

.rdo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--l1); }

.rdo b { display: block; margin-top: 3px; font-family: var(--f-mono); font-stretch: 87.5%; font-weight: 500; font-size: 16px; color: var(--t1); white-space: nowrap; }

.rdo .fail b { color: var(--fail); } .rdo .warn b { color: var(--warn); }
.isec { padding: 12px 16px 4px; }

.cks { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }

.cks li.fail span { color: #ffb3b3; }
.wxm { margin: 4px 16px 0; border: 1px solid var(--l2); background: var(--s2); padding: 10px 12px; display: grid; gap: 8px; cursor: pointer; text-align: left; color: var(--t1); width: calc(100% - 32px); }

.wbar b { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--fail); }
.wxm-r { display: flex; justify-content: space-between; font-family: var(--f-mono); font-stretch: 87.5%; font-size: 10px; color: var(--t3); } .wxm-r b { color: var(--t1); font-weight: 500; }

/* ======================= PAGES ======================= */
.page { position: absolute; inset: 0 0 0 var(--rail-w); z-index: 8; background: var(--bg); overflow-y: auto; animation: pageIn .35s var(--ease); }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } }
.pg { max-width: 1320px; margin: 0 auto; padding: 26px max(24px, env(safe-area-inset-right)) 60px 28px; display: grid; gap: 18px; align-content: start; }
.pg-h { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--l1); }

.pg-h .sp { flex: 1; }

h2.sec::before { content: ""; width: 8px; height: 1px; background: var(--amber); }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.pcard { position: relative; border: 1px solid var(--l2); background: var(--s1); padding: 14px 14px 12px; display: grid; gap: 10px; transition: border-color .15s, transform .25s var(--ease); }

.pcard dt { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--t3); font-weight: 700; } .pcard dd { margin: 2px 0 0; font-family: var(--f-mono); font-stretch: 87.5%; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 8px; font-size: 10px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; border: 1px solid var(--l2); color: var(--t2); white-space: nowrap; }
.pill::before { content: ""; width: 5px; height: 5px; background: currentColor; }
.pill.ok { color: var(--ok); border-color: rgba(47, 224, 138, .35); } .pill.warn { color: var(--warn); border-color: var(--amber-line); } .pill.fail { color: var(--fail); border-color: rgba(255, 75, 75, .45); }
.examples { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.ex { border: 1px solid var(--l2); background: var(--s1); padding: 12px 14px; text-align: left; display: grid; gap: 4px; color: var(--t1); transition: border-color .15s; }
.ex:hover { border-color: var(--amber-line); }
.ex b { font-weight: 800; font-stretch: 75%; font-size: 18px; letter-spacing: .02em; color: var(--amber); text-transform: uppercase; }
.ex span { font-size: 12px; color: var(--t3); }
.empty { padding: 30px; text-align: center; color: var(--t3); border: 1px dashed var(--l2); }
.two-col { display: grid; grid-template-columns: minmax(230px, 300px) minmax(0, 1fr); gap: 18px; align-items: start; }
.flist { display: grid; gap: 4px; position: sticky; top: 14px; max-height: calc(100vh - 140px); overflow-y: auto; }
.fli { position: relative; text-align: left; background: var(--s1); border: 1px solid var(--l2); padding: 9px 12px 9px 14px; display: grid; gap: 1px; color: var(--t1); }
.fli::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--bc, var(--l3)); }
.fli[aria-current="true"] { border-color: var(--amber-line); background: var(--amber-soft); }
.fli b { font-weight: 750; font-size: 13px; } .fli span { font-size: 11px; color: var(--t3); }
.card { background: var(--s1); border: 1px solid var(--l2); }
.card-b { padding: 16px; display: grid; gap: 12px; }
.card h2 { margin: 0; font-weight: 800; font-stretch: 75%; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; }
.card h3 { margin: 4px 0 0; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--t2); font-weight: 750; }
details.card > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 12.5px; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::after { content: ""; margin-left: auto; width: 6px; height: 6px; border-right: 1.5px solid var(--t3); border-bottom: 1.5px solid var(--t3); transform: rotate(-45deg); transition: transform .15s; flex: none; }
details.card[open] > summary::after { transform: rotate(45deg); }
.sum-meta { font-size: 11px; font-weight: 500; color: var(--t3); }
.chart-preview { max-height: 360px; overflow: auto; border: 1px solid var(--l1); }
.chart-preview table { border-collapse: collapse; font-family: var(--f-mono); font-stretch: 87.5%; font-size: 10.5px; }
.chart-preview th, .chart-preview td { padding: 3px 7px; border: 1px solid var(--l1); text-align: right; }
.chart-preview th { background: var(--s3); position: sticky; top: 0; color: var(--amber); }
.thumb { width: 100%; max-height: 150px; object-fit: contain; background: #fff; border: 1px solid var(--l2); }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--l1); white-space: nowrap; }
.tbl th { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--t3); font-weight: 750; }
.about { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; padding: 16px; border: 1px solid var(--l2); background: linear-gradient(135deg, var(--s2), var(--s1)); }

.about b { display: block; font-size: 14px; } .about span { display: block; color: var(--t3); font-size: 12px; } .about em { font-style: normal; color: var(--amber); font-weight: 700; }
.dxf-prev { position: relative; width: 100%; height: 340px; background: #0b0f14; border: 1px solid var(--l2); overflow: hidden; cursor: crosshair; }
.dxf-prev svg { width: 100%; height: 100%; display: block; }
.steps-mini { display: flex; gap: 6px; flex-wrap: wrap; } .steps-mini span { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--t3); border: 1px solid var(--l2); padding: 3px 8px; font-weight: 700; } .steps-mini span.on { color: var(--amber); border-color: var(--amber-line); } .steps-mini span.done { color: var(--ok); border-color: rgba(47, 224, 138, .35); }

/* dialogs & wizard */
.wiz-back { position: fixed; inset: 0; z-index: 90; background: rgba(3, 5, 8, .7); display: grid; place-items: center; padding: 16px; backdrop-filter: blur(4px); animation: fadeIn .2s; }
@keyframes fadeIn { from { opacity: 0; } }
.wiz { width: min(780px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--s1); border: 1px solid var(--l2); box-shadow: 0 30px 90px rgba(0, 0, 0, .6); overflow: hidden; position: relative; animation: pop .25s var(--ease); }

.wiz-head > div { flex: 1; }
.eyebrow { font-family: var(--f-mono); font-stretch: 87.5%; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--amber); }

.wiz-steps { list-style: none; margin: 0; padding: 8px 20px 14px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; border-bottom: 1px solid var(--l1); }
.wiz-steps button { width: 100%; border: 0; background: none; color: var(--t4); display: grid; gap: 6px; text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 0; }
.wiz-steps button::before { content: ""; height: 2px; background: var(--l2); }

.wiz-body { padding: 16px 20px 20px; overflow-y: auto; display: grid; gap: 14px; }

.wiz-foot { display: flex; gap: 10px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--l1); }
.wiz-foot .err { flex: 1; color: var(--fail); font-size: 12px; font-weight: 600; text-align: right; }
.wiz label.f > span:first-child { font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--t3); }
.wiz label.f .unit { color: var(--t4); letter-spacing: .04em; text-transform: none; font-weight: 500; }
.chips-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 5px; }
.chips-pick .chip { height: auto; display: grid; gap: 1px; padding: 9px 10px; text-align: left; color: var(--t1); background: var(--s2); }
.chips-pick .chip b { font-size: 12.5px; } .chips-pick .chip small { font-size: 10.5px; color: var(--t3); }
.chips-pick .chip.on { border-color: var(--amber-line); background: var(--amber-soft); }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.opt { border: 1px solid var(--l2); background: var(--s2); padding: 12px; display: grid; gap: 10px; align-content: start; }
.opt.top { border-color: var(--amber-line); box-shadow: inset 0 2px 0 var(--amber); }
.opt header { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: center; }
.opt header .pill { grid-column: 1 / -1; justify-self: start; }
.opt .cls { font-family: var(--f-mono); font-stretch: 87.5%; font-size: 22px; color: var(--amber); } .opt .cls small { font-size: 10px; color: var(--t3); }
.opt header b { display: block; font-weight: 800; font-stretch: 75%; font-size: 17px; text-transform: uppercase; }
.opt header div span { font-size: 11px; color: var(--t3); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .lmi { position: relative; height: 20px; background: var(--s4); overflow: hidden; }
.opt .lmi i { position: absolute; inset: 0 auto 0 0; background: var(--ok); opacity: .85; } .opt.warn .lmi i { background: var(--warn); } .opt.fail .lmi i { background: var(--fail); }
.opt .lmi span { position: absolute; right: 7px; top: 3px; font-family: var(--f-mono); font-size: 11px; color: #fff; text-shadow: 0 1px 2px #000; }
.opt dl { margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.opt dt { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--t3); font-weight: 700; } .opt dd { margin: 0; font-family: var(--f-mono); font-stretch: 87.5%; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt .why { margin: 0; font-size: 11.5px; color: #ffb3b3; }
.layers { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 10px; max-height: 240px; overflow-y: auto; border: 1px solid var(--l2); padding: 8px; }
.layers .check span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; font-size: 12px; } .layers .check small { color: var(--t4); font-family: var(--f-mono); font-size: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 150; background: rgba(18, 23, 29, .96); color: var(--t1); padding: 10px 16px 10px 14px; font-weight: 600; font-size: 12.5px; border: 1px solid var(--l3); border-left: 2px solid var(--amber); box-shadow: 0 16px 40px rgba(0, 0, 0, .5); max-width: calc(100vw - 32px); animation: toastIn .3s var(--ease); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } }

/* ======================= TOUR (site induction) ======================= */

.tdim { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.tdim-fill { fill: rgba(3, 6, 11, .74); pointer-events: none; }
